    }
    if (location.hash === hash) { window.scrollTo(0, 0); return; }
    location.hash = hash;
  }
  renderVals() {
    const r = this.state.route;
    const onNav = (id) => this.go(id === 'events' ? '#/events' : '#/');
    const onOpen = (id) => this.go('#/events/' + id);
    const link = (hash) => (e) => { e.preventDefault(); this.go(hash); };
    return {
      isHome: r.name === 'home',
      isEvents: r.name === 'events',
      isDetail: r.name === 'eventdetail',
      dsReady: this.state.ds,
      dsLoading: !this.state.ds,
      showEvents: this.state.ds && r.name === 'events',
      showDetail: this.state.ds && r.name === 'eventdetail',
      navCurrent: r.name === 'home' ? 'home' : 'events',
      onNav, onOpen,
      goHome: link('#/'),
      goEvents: link('#/events'),
      detailProps: { id: r.id, onNav, onOpen },
    };
  }
}
</script>
</body>
</html>
